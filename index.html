<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vlad Purza</title>
  <meta name="description" content="Vlad Purza — product designer & front-end developer. Aplicații, site-uri și design systems care se înțeleg din prima.">
  <meta name="theme-color" content="#2b2fd6">
  <meta property="og:title" content="Vlad Purza — Portofoliu">
  <meta property="og:description" content="Product designer & front-end developer din Cluj-Napoca.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Hanken+Grotesk:ital,wght@0,300..700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    /* Aplică tema salvată înainte de randare, ca să nu clipească */
    try { var t = localStorage.getItem("vp-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main" id="skip-link">Sari la conținut</a>

  <!-- Ecran de încărcare -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader__inner">
      <span class="loader__name" id="loader-name"></span>
      <span class="loader__count" id="loader-count">0</span>
    </div>
  </div>

  <!-- Cursor personalizat (doar pe desktop) -->
  <div class="cursor" id="cursor" aria-hidden="true"><span class="cursor__label" id="cursor-label"></span></div>

  <header class="header on-hero" id="header"></header>
  <nav class="menu" id="menu" aria-label="Meniu mobil" hidden></nav>

  <main id="main">
    <noscript><p class="wrap" style="padding-block:120px">Activează JavaScript pentru a vedea portofoliul.</p></noscript>
  </main>

  <footer class="footer" id="footer"></footer>

  <dialog class="case" id="case" aria-labelledby="case-title"></dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
